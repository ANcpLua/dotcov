# Dependency updates. Dependabot holds each new version for its default 3-day cooldown;
# dependabot-auto-merge.yml merges everything except major bumps once main's required
# checks pass.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: deps
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: deps
