name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without v prefix)'
        required: true

permissions:
  contents: read
  id-token: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_release: ${{ steps.ver.outputs.is_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Event data reaches the script through env, never spliced into its text.
      - id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "version=$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.$(git rev-list --count HEAD)-ci.g$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Workflow and action lint: actionlint checks every workflow, shellchecks their scripts, and
      # validates local action inputs; shellcheck (on the runner) covers the badge action's script.
      # actionlint is pinned by version and checksum, like the actions above by commit.
      - name: Lint workflows and actions
        run: |
          curl -fsSLo "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
          shellcheck .github/actions/badge/badge.sh
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet build DotCov.slnx -c Release -p:Version=${{ needs.version.outputs.version }}
        env:
          CI: true

  test:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      # Microsoft.Testing.Platform runner (global.json) with coverlet.MTP. -p:Coverage=true
      # switches on the coverlet arguments defined in tests/DotCov.Tests/DotCov.Tests.csproj.
      # The file lands in TestResults as dotcov.coverage.cobertura.<timestamp>.xml, which the
      # gate reads.
      - name: Test
        run: >-
          dotnet test --solution DotCov.slnx -c Release -p:Version=${{ needs.version.outputs.version }}
          -p:Coverage=true --results-directory TestResults
        env:
          CI: true
      # Dogfood gate: the same Fallout Coverage target as local runs, pointed at this run's
      # reports (a fresh checkout holds no other run). A src/ project missing from the report, or
      # a coverage drop below build/Build.cs's thresholds, fails the job, on PRs and main alike.
      # Ubuntu only: coverlet cannot instrument on the Windows runner ("DotCov.dll ... is being
      # used by another process"), so that leg writes no report and the gate reads NODATA.
      # Skipped when the tests failed. Coverage is enforced without publishing a badge branch.
      - name: Coverage gate (dotcov checking dotcov)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool restore
          dotnet fallout Coverage --reports TestResults

  # Exercise the composite action and its default installer against this checkout's portable
  # package. A release candidate is not on NuGet yet. Native packages are packed separately;
  # the local-only feed prevents an already-published version from masking this checkout.
  # Badge pushes go to a local bare repository: no GitHub badge branch or write token.
  badge-action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Pack the candidate for the default tool installer
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/badge-nuget-cache
        run: |
          echo "NUGET_PACKAGES=$NUGET_PACKAGES" >> "$GITHUB_ENV"
          V=$(dotnet msbuild src/DotCov.Tool/DotCov.Tool.csproj -nologo -getProperty:VersionPrefix)
          FEED="$RUNNER_TEMP/badge-packages"
          dotnet pack src/DotCov.Tool/DotCov.Tool.csproj -c Release -r any \
            -p:PublishAot=false -p:Version="$V" -p:ToolPackageRuntimeIdentifiers=any -o "$FEED"
          dotnet pack src/DotCov.Tool/DotCov.Tool.csproj -c Release \
            -p:Version="$V" -p:ToolPackageRuntimeIdentifiers=any -o "$FEED"
          # Configure only this disposable job's subsequent tool installs. Packing restores
          # dependencies before this file exists; the action itself keeps its default inputs.
          test ! -e NuGet.Config
          printf '%s\n' '<configuration><packageSources><clear /></packageSources></configuration>' > NuGet.Config
          dotnet nuget add source "$FEED" --name candidate --configfile NuGet.Config
      - name: Set up isolated badge origin and Cobertura report
        run: |
          git init --bare "$RUNNER_TEMP/badge-origin.git"
          git remote set-url origin "$RUNNER_TEMP/badge-origin.git"
          mkdir -p badge-reports
          cat > badge-reports/coverage.cobertura.xml <<'XML'
          <coverage line-rate="1" branch-rate="0.5" lines-covered="1" lines-valid="1" branches-covered="1" branches-valid="2">
            <packages><package name="fixture"><classes><class name="Fixture" filename="src/Fixture.cs">
              <lines><line number="1" hits="1" branch="true" condition-coverage="50% (1/2)" /></lines>
            </class></classes></package></packages>
          </coverage>
          XML
      - name: Install tool, gate and publish a passing badge
        id: pass
        uses: ./.github/actions/badge
        with:
          reports: badge-reports
          min-line: '100'
          min-branch: '40'
      - name: Keep an unchanged badge at the same commit
        uses: ./.github/actions/badge
        with:
          reports: badge-reports
          min-line: '100'
          min-branch: '40'
      - name: Publish a failing badge and fail the gate
        id: fail
        continue-on-error: true
        uses: ./.github/actions/badge
        with:
          reports: badge-reports
          min-line: '100'
          min-branch: '60'
      - name: Verify action outputs, gate failure and published history
        env:
          PASS_CODE: ${{ steps.pass.outputs.exit-code }}
          FAIL_CODE: ${{ steps.fail.outputs.exit-code }}
          FAIL_OUTCOME: ${{ steps.fail.outcome }}
          BADGE_DIRECTORY: ${{ steps.fail.outputs.directory }}
        run: |
          test "$PASS_CODE" = 0
          test "$FAIL_CODE" = 1
          test "$FAIL_OUTCOME" = failure
          test -f "$BADGE_DIRECTORY/coverage-badge.svg"
          git fetch origin badges
          test "$(git rev-list --count FETCH_HEAD)" = 2
          git show FETCH_HEAD:coverage-badge.json > published-badge.json
          cmp "$BADGE_DIRECTORY/coverage-badge.json" published-badge.json
          grep -q '"color":"red"' published-badge.json

  # Real, unmodified upstream suites. Native producer JSON is the independent oracle
  # for both aggregate and per-file counts; all badge pushes stay on the runner.
  consumer-coverage:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        language: [typescript, python]
        include:
          - language: typescript
            repository: voodoocreation/ts-deepmerge
            revision: 305a05831a462fb2c353d3cbbff55a0733286f8c # 7.0.3
          - language: python
            repository: pallets/itsdangerous
            revision: 096c8d42545d3b68ea21a4f890fb2b2d8979c0bd # 2.2.0
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: .consumer
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.language == 'typescript'
        with:
          node-version: '24'
      - name: Install locked TypeScript test dependencies
        if: matrix.language == 'typescript'
        working-directory: .consumer
        run: npm exec --yes --package yarn@1.22.22 -- yarn install --frozen-lockfile --ignore-scripts
      - name: Install pinned Python test dependencies
        if: matrix.language == 'python'
        run: |
          python -m pip install -r .consumer/requirements/tests.txt coverage==7.10.4 flit_core==3.9.0
          python -m pip install --no-build-isolation -e .consumer
      - name: Build the current DotCov CLI
        run: dotnet build src/DotCov.Tool/DotCov.Tool.csproj -c Release
      - name: Measure upstream tests and compare native counts with DotCov
        env:
          COVERAGE_LANGUAGE: ${{ matrix.language }}
        run: >-
          python .github/tests/consumer_coverage.py measure "$COVERAGE_LANGUAGE"
          --project .consumer --output .consumer-results
          --tool src/DotCov.Tool/bin/Release/net10.0/DotCov.Tool.dll
      - name: Prepare a local badge origin
        run: |
          git init --bare .consumer-results/origin.git
          git remote set-url origin "$PWD/.consumer-results/origin.git"
      - name: Publish a passing badge from the real report
        id: pass
        uses: ./.github/actions/badge
        with:
          reports: .consumer-results/coverage.xml
          min-line: '90'
          min-branch: '90'
          command: dotnet src/DotCov.Tool/bin/Release/net10.0/DotCov.Tool.dll
      - name: Publish a red badge when the real branch rate fails
        id: fail
        continue-on-error: true
        uses: ./.github/actions/badge
        with:
          reports: .consumer-results/coverage.xml
          min-line: '90'
          min-branch: '100'
          command: dotnet src/DotCov.Tool/bin/Release/net10.0/DotCov.Tool.dll
      - name: Verify badge values, action outputs and published files
        env:
          PASS_CODE: ${{ steps.pass.outputs.exit-code }}
          FAIL_CODE: ${{ steps.fail.outputs.exit-code }}
          FAIL_OUTCOME: ${{ steps.fail.outcome }}
          PASS_DIRECTORY: ${{ steps.pass.outputs.directory }}
          FAIL_DIRECTORY: ${{ steps.fail.outputs.directory }}
        run: python .github/tests/consumer_coverage.py badges --output .consumer-results
      - name: Retain the real reports and comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: consumer-coverage-${{ matrix.language }}-${{ matrix.os }}
          path: |
            .consumer-results/*.xml
            .consumer-results/*.json
            .consumer-results/*.svg
            .consumer-results/cli-*/coverage-badge.*
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  # Compare fresh measurements with the published coverage behind upstream README badges.
  # Historical service evidence is pinned alongside each source SHA; moving badges are not an oracle.
  readme-badge-coverage:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        target: [compare-versions, pydash, peek-readable]
        include:
          - target: compare-versions
            repository: omichelsen/compare-versions
            revision: 98e81116ef4197b42dca8c3fde8d1e8166e2a81f
            node: '20.15.1'
            min-line: '100'
            min-branch: '0'
          - target: pydash
            repository: dgilland/pydash
            revision: f46de3669742c075e5379c1e193c86c1c2c70dc2
            min-line: '100'
            min-branch: '0'
          - target: peek-readable
            repository: Borewit/peek-readable
            revision: 9cef754de7baad45e43195bbb35bd9bbf30abbc9 # 5.4.2
            node: '20.18.2'
            min-line: '98.086'
            min-branch: '94.736'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: .readme-consumer
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.target != 'pydash'
        with:
          node-version: ${{ matrix.node }}
      - name: Install upstream locked TypeScript dependencies
        if: matrix.target == 'compare-versions'
        working-directory: .readme-consumer
        run: npm ci --ignore-scripts
      - name: Install upstream locked async TypeScript dependencies
        if: matrix.target == 'peek-readable'
        working-directory: .readme-consumer
        run: npm exec --yes --package=@yarnpkg/cli-dist@4.6.0 -- yarn install --immutable
      - name: Verify real timer enforcement rejects invalid tests
        if: matrix.target == 'peek-readable'
        env:
          PEEK_PROJECT: .readme-consumer
        run: node --test .github/tests/test_peek_real_timers.cjs
      - name: Install the published Python coverage toolchain
        if: matrix.target == 'pydash'
        run: |
          python -m pip install -r .github/tests/readme-badges/requirements.txt
          python -m pip install --no-build-isolation --no-deps -e .readme-consumer
      - name: Verify deterministic pydash timing and failure detection
        if: matrix.target == 'pydash'
        run: python -m pytest .github/tests/test_pydash_clock.py -q
      - name: Verify real pydash timer threads and concurrency
        if: matrix.target == 'pydash'
        run: >-
          python -m pytest .github/tests/test_pydash_threads.py -q
          --junitxml=.readme-thread-results/tests.xml
      - name: Build the current DotCov CLI
        run: dotnet build src/DotCov.Tool/DotCov.Tool.csproj -c Release
      - name: Reproduce coverage at the README badge's recorded commit
        env:
          COVERAGE_TARGET: ${{ matrix.target }}
        run: >-
          python .github/tests/readme_badge_coverage.py measure "$COVERAGE_TARGET"
          --project .readme-consumer --output .readme-badge-results
          --tool src/DotCov.Tool/bin/Release/net10.0/DotCov.Tool.dll
      - name: Prepare a local badge origin
        run: |
          git init --bare .readme-badge-results/origin.git
          git remote set-url origin "$PWD/.readme-badge-results/origin.git"
      - name: Publish the matching coverage badge
        id: badge
        uses: ./.github/actions/badge
        with:
          reports: .readme-badge-results/coverage.xml
          min-line: ${{ matrix.min-line }}
          min-branch: ${{ matrix.min-branch }}
          command: dotnet src/DotCov.Tool/bin/Release/net10.0/DotCov.Tool.dll
      - name: Compare the action badge with the published upstream percentage
        env:
          BADGE_CODE: ${{ steps.badge.outputs.exit-code }}
          BADGE_DIRECTORY: ${{ steps.badge.outputs.directory }}
        run: python .github/tests/readme_badge_coverage.py badge --output .readme-badge-results
      - name: Reject missing async TypeScript lines with a red badge
        if: matrix.target == 'peek-readable'
        id: line-fail-badge
        continue-on-error: true
        uses: ./.github/actions/badge
        with:
          reports: .readme-badge-results/coverage.xml
          min-line: '100'
          min-branch: ${{ matrix.min-branch }}
          command: dotnet src/DotCov.Tool/bin/Release/net10.0/DotCov.Tool.dll
      - name: Require the line gate failure and exact published badge
        if: matrix.target == 'peek-readable'
        env:
          BADGE_CODE: ${{ steps.line-fail-badge.outputs.exit-code }}
          BADGE_DIRECTORY: ${{ steps.line-fail-badge.outputs.directory }}
          BADGE_OUTCOME: ${{ steps.line-fail-badge.outcome }}
        run: python .github/tests/readme_badge_coverage.py badge --output .readme-badge-results --phase line-fail
      - name: Reject missing async TypeScript branches with a red badge
        if: matrix.target == 'peek-readable'
        id: branch-fail-badge
        continue-on-error: true
        uses: ./.github/actions/badge
        with:
          reports: .readme-badge-results/coverage.xml
          min-line: ${{ matrix.min-line }}
          min-branch: '100'
          command: dotnet src/DotCov.Tool/bin/Release/net10.0/DotCov.Tool.dll
      - name: Require the branch gate failure and exact published badge
        if: matrix.target == 'peek-readable'
        env:
          BADGE_CODE: ${{ steps.branch-fail-badge.outputs.exit-code }}
          BADGE_DIRECTORY: ${{ steps.branch-fail-badge.outputs.directory }}
          BADGE_OUTCOME: ${{ steps.branch-fail-badge.outcome }}
        run: python .github/tests/readme_badge_coverage.py badge --output .readme-badge-results --phase branch-fail
      - name: Retain README badge comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: readme-badge-${{ matrix.target }}-${{ matrix.os }}
          path: |
            .readme-badge-results/*.xml
            .readme-badge-results/*.json
            .readme-badge-results/*.svg
            .readme-badge-results/cli-*/coverage-badge.*
            .readme-thread-results/*.xml
            .github/tests/readme-badges/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  # Native AOT packages for DotCov.Tool — one RID per runner (Native AOT cannot cross-OS
  # compile, so each OS's package is built on that OS). Release-only; fail-fast so a single
  # RID failure fails the whole job and gates `publish` (no partial/broken RID set ships).
  pack-tool-native:
    needs: version
    if: needs.version.outputs.is_release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest,     rid: osx-arm64 }
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Install Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Pack ${{ matrix.rid }} (Native AOT)
        run: dotnet pack src/DotCov.Tool/DotCov.Tool.csproj -c Release -r ${{ matrix.rid }} -p:Version=${{ needs.version.outputs.version }} -o artifacts
        env:
          CI: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pkg-${{ matrix.rid }}
          path: artifacts/*.nupkg
          if-no-files-found: error

  # The RID-agnostic pieces: portable CoreCLR `any` fallback (Windows/Intel-Mac/musl/...),
  # the DotCov.Tool pointer package, and the plain DotCov + DotCov.Fallout library packages.
  pack-rest:
    needs: version
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Pack any-fallback, pointer, and libraries
        run: |
          V=${{ needs.version.outputs.version }}
          dotnet pack src/DotCov.Tool/DotCov.Tool.csproj -c Release -r any -p:PublishAot=false -p:Version=$V -o artifacts
          dotnet pack src/DotCov.Tool/DotCov.Tool.csproj -c Release -p:Version=$V -o artifacts
          dotnet pack src/DotCov/DotCov.csproj           -c Release -p:Version=$V -o artifacts
          dotnet pack src/DotCov.Fallout/DotCov.Fallout.csproj -c Release -p:Version=$V -o artifacts
        env:
          CI: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pkg-rest
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    needs: [version, build, test, badge-action, consumer-coverage, readme-badge-coverage, pack-tool-native, pack-rest]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          pattern: pkg-*
          merge-multiple: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      - name: Authenticate to NuGet (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ANcpLua
      # Push every sub-package FIRST (RID-specific, `any`, and the libraries). The DotCov.Tool
      # *pointer* is held back: NuGet requires the packages it references to exist before it.
      - name: Push sub-packages
        run: |
          shopt -s nullglob
          POINTER="DotCov.Tool.${{ needs.version.outputs.version }}.nupkg"
          for pkg in artifacts/*.nupkg; do
            [ "$(basename "$pkg")" = "$POINTER" ] && continue
            dotnet nuget push "$pkg" --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
          done
      # Pointer LAST, as its own step — only reached if every sub-package push above succeeded.
      # If a sub-package 403s or fails, the job aborts here and no broken pointer is published.
      - name: Push the DotCov.Tool pointer
        run: |
          dotnet nuget push "artifacts/DotCov.Tool.${{ needs.version.outputs.version }}.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

  # The GitHub Release for a tag, after every package is on NuGet. Its notes are the finished
  # docs/releases/<version>.md; a tag without that file fails here, on purpose. Manual
  # dispatches publish packages only: they have no tag to release against, so this job is tag
  # pushes only.
  release:
    needs: [version, publish]
    if: needs.version.outputs.is_release == 'true' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create the GitHub Release from docs/releases
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          test -f "docs/releases/$V.md" || { echo "docs/releases/$V.md is missing"; exit 1; }
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V exists already"; exit 0
          fi
          gh release create "v$V" --verify-tag --title "DotCov $V" --notes-file "docs/releases/$V.md"
