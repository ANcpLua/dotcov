name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without v prefix)'
        required: true

permissions:
  contents: read
  id-token: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_release: ${{ steps.ver.outputs.is_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: ver
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.$(git rev-list --count HEAD)-ci.g$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet build DotCov.slnx -c Release -p:Version=${{ needs.version.outputs.version }}
        env:
          CI: true

  test:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # badge push to the `badges` branch (ubuntu + main only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test DotCov.slnx -c Release -p:Version=${{ needs.version.outputs.version }} --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory TestResults
        env:
          CI: true
      # Dogfood: dotcov measures dotcov, and renders its own badge. Both artifacts are written
      # from one RATE so they cannot disagree: coverage-badge.svg is what the READMEs display,
      # coverage-badge.json is the shields.io endpoint schema kept for machine consumers.
      # Published to the `badges` branch and served from raw.githubusercontent — the coverage
      # number is measured, formatted and drawn here, with no third-party service in the path.
      - name: Generate coverage badge (dotcov measuring dotcov)
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet run --project src/DotCov.Tool -c Release -- report TestResults --format json > coverage.json
          RATE=$(jq -r '.summary.lineRate // empty' coverage.json)
          # Absent key means no line data was measured; a badge claiming otherwise would lie.
          if [ -z "$RATE" ]; then echo "no line data — refusing to publish a badge"; exit 1; fi
          COLOR=$(awk -v r="$RATE" 'BEGIN { print (r >= 90) ? "brightgreen" : (r >= 75) ? "yellow" : "red" }')
          MSG=$(awk -v r="$RATE" 'BEGIN { printf "%.1f%%", r }')
          if   [ "$COLOR" = brightgreen ]; then HEX='#4b0'
          elif [ "$COLOR" = yellow ];      then HEX='#dfb317'
          else                                  HEX='#e05d44'; fi
          # Verdana 11px advance widths, x10: "Coverage" measures 530, and the message is only
          # ever digits, '.' and '%'. textLength pins the drawn width, so a slightly-off estimate
          # shifts glyph spacing but can never clip. Geometry matches shields' flat-square style
          # so this badge sits flush with the others in the README.
          LTEXT=530
          MTEXT=$(awk -v s="$MSG" 'BEGIN {
            for (i = 1; i <= length(s); i++) { c = substr(s, i, 1)
              w += (c == ".") ? 34 : (c == "%") ? 110 : 70 }
            printf "%d", w }')
          LW=$(( (LTEXT + 100) / 10 )); MW=$(( (MTEXT + 100) / 10 ))
          TOTAL=$((LW + MW)); LX=$(( (LTEXT + 100) / 2 )); MX=$(( LW * 10 + (MTEXT + 100) / 2 ))
          cat > coverage-badge.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="$TOTAL" height="20" role="img" aria-label="Coverage: $MSG"><title>Coverage: $MSG</title><g shape-rendering="crispEdges"><rect width="$LW" height="20" fill="#555"/><rect x="$LW" width="$MW" height="20" fill="$HEX"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110"><text x="$LX" y="140" textLength="$LTEXT" transform="scale(.1)">Coverage</text><text x="$MX" y="140" textLength="$MTEXT" transform="scale(.1)">$MSG</text></g></svg>
          SVG
          printf '{"schemaVersion":1,"label":"Coverage","message":"%s","color":"%s"}\n' "$MSG" "$COLOR" > coverage-badge.json
          echo "badge: $MSG ($COLOR) ${TOTAL}x20"
      - name: Publish badge to badges branch
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges
          git worktree add -B badges badge-wt origin/badges
          cp coverage-badge.svg coverage-badge.json badge-wt/
          cd badge-wt
          git add coverage-badge.svg coverage-badge.json
          git diff --cached --quiet || { git commit -m "badge: $(jq -r .message ../coverage-badge.json) coverage"; git push origin badges; }

  # Native AOT packages for DotCov.Tool — one RID per runner (Native AOT cannot cross-OS
  # compile, so each OS's package is built on that OS). Release-only; fail-fast so a single
  # RID failure fails the whole job and gates `publish` (no partial/broken RID set ships).
  pack-tool-native:
    needs: version
    if: needs.version.outputs.is_release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest,     rid: osx-arm64 }
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Install Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Pack ${{ matrix.rid }} (Native AOT)
        run: dotnet pack src/DotCov.Tool/DotCov.Tool.csproj -c Release -r ${{ matrix.rid }} -p:Version=${{ needs.version.outputs.version }} -o artifacts
        env:
          CI: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pkg-${{ matrix.rid }}
          path: artifacts/*.nupkg
          if-no-files-found: error

  # The RID-agnostic pieces: portable CoreCLR `any` fallback (Windows/Intel-Mac/musl/...),
  # the DotCov.Tool pointer package, and the plain DotCov + DotCov.Nuke library packages.
  pack-rest:
    needs: version
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Pack any-fallback, pointer, and libraries
        run: |
          V=${{ needs.version.outputs.version }}
          dotnet pack src/DotCov.Tool/DotCov.Tool.csproj -c Release -r any -p:PublishAot=false -p:Version=$V -o artifacts
          dotnet pack src/DotCov.Tool/DotCov.Tool.csproj -c Release -p:Version=$V -o artifacts
          dotnet pack src/DotCov/DotCov.csproj           -c Release -p:Version=$V -o artifacts
          dotnet pack src/DotCov.Nuke/DotCov.Nuke.csproj -c Release -p:Version=$V -o artifacts
        env:
          CI: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pkg-rest
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    needs: [version, build, test, pack-tool-native, pack-rest]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: pkg-*
          merge-multiple: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      - name: Authenticate to NuGet (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ANcpLua
      # Push every sub-package FIRST (RID-specific, `any`, and the libraries). The DotCov.Tool
      # *pointer* is held back: NuGet requires the packages it references to exist before it.
      - name: Push sub-packages
        run: |
          shopt -s nullglob
          POINTER="DotCov.Tool.${{ needs.version.outputs.version }}.nupkg"
          for pkg in artifacts/*.nupkg; do
            [ "$(basename "$pkg")" = "$POINTER" ] && continue
            dotnet nuget push "$pkg" --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
          done
      # Pointer LAST, as its own step — only reached if every sub-package push above succeeded.
      # If a sub-package 403s or fails, the job aborts here and no broken pointer is published.
      - name: Push the DotCov.Tool pointer
        run: |
          dotnet nuget push "artifacts/DotCov.Tool.${{ needs.version.outputs.version }}.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
