<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DotCov coverage</title>
  <style>
    :root { color-scheme: light dark; --fg: #1f2328; --muted: #59636e; --bg: #ffffff; --link: #0969da; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --muted: #9198a1; --bg: #0d1117; --link: #4493f8; } }
    body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--fg);
           font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    p { margin: 16px 0; color: var(--muted); }
    a { color: var(--link); }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>DotCov coverage</h1>
    <a href="https://github.com/ANcpLua/dotcov/actions/workflows/nuget-publish.yml?query=branch%3Amain">
      <img src="coverage-badge.svg" alt="Coverage of main">
    </a>
    <p>Line and branch coverage of <code>main</code>, drawn by dotcov's own gate
      (<code>fallout Coverage</code>, 100% line and branch required) on every push.</p>
    <p>Badge: <a href="coverage-badge.svg"><code>coverage-badge.svg</code></a> ·
      shields.io endpoint: <a href="coverage-badge.json"><code>coverage-badge.json</code></a></p>
    <p><a href="https://github.com/ANcpLua/dotcov#readme">DotCov on GitHub</a> ·
      <a href="https://www.nuget.org/packages/DotCov.Tool/">DotCov.Tool on NuGet</a></p>
  </main>
</body>
</html>
